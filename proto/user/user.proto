syntax = "proto3";

package user;

option go_package = "github.com/s-usmonalizoda25/protoAuction/gen/user;userv1";

service UserService {
  rpc Register(RegisterRequest) returns (RegisterResponse);
  rpc Login(LoginRequest) returns (LoginResponse);
  rpc GetProfile(GetProfileRequest) returns (GetProfileResponse);

  rpc HoldFunds(HoldFundsRequest) returns (HoldFundsResponse);
  rpc DepositFunds(DepositFundsRequest) returns (DepositFundsResponse);

  // ReleaseFunds и CaptureFunds намеренно не являются RPC — это внутренние
  // обработчики событий RabbitMQ (bid.accepted, lot.closed) внутри user-service,
  // не вызываются напрямую другими сервисами по сети.
}

message RegisterRequest {
  string email = 1;
  string password = 2;
}

message RegisterResponse {
  int64 user_id = 1;
  string email = 2;
}

message LoginRequest {
  string email = 1;
  string password = 2;
}

message LoginResponse {
  string token = 1;
  int64 user_id = 2;
}

message GetProfileRequest {
  int64 user_id = 1;
}

message GetProfileResponse {
  int64 user_id = 1;
  string email = 2;
  int64 balance_minor = 3;
  int64 held_amount_minor = 4;
}

message HoldFundsRequest {
  int64 user_id = 1;
  int64 amount_minor = 2;
}

message HoldFundsResponse {
  bool success = 1;
  string message = 2;
}

message ReleaseFundsRequest {
  int64 user_id = 1;
  int64 amount_minor = 2;
}

message ReleaseFundsResponse {
  bool success = 1;
  string message = 2;
}

message CaptureFundsRequest {
  int64 user_id = 1;
  int64 amount_minor = 2;
}

message CaptureFundsResponse {
  bool success = 1;
  string message = 2;
}

message DepositFundsRequest {
  int64 user_id = 1;
  int64 amount_minor = 2;
}

message DepositFundsResponse {
  bool success = 1;
  int64 new_balance_minor = 2;
}